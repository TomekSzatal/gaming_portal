{% extends "base.html" %}

{% block content %}

  <h1>
    {{ article.title }}

    <a href="{% url 'games:article-delete' pk=article.id %}"
       class="btn btn-danger link-to-page">
      Delete
    </a>

    <a href="{% url 'games:article-update' pk=article.id %}"
       class="btn btn-secondary link-to-page">
      Update
    </a>
  </h1>

  <hr>

  <p>
    <strong>Game:</strong>
    {{ article.game.title }}
  </p>

  <p>
    <strong>Created at:</strong>
    {{ article.created_at }}
  </p>

  <p>
    <strong>Authors:</strong>
  </p>

  <ul>
    {% for author in article.authors.all %}
      <li>{{ author.username }}</li>
    {% endfor %}
  </ul>

  <hr>

  <p>{{ article.content }}</p>

{% endblock %}
