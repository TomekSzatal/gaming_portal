{% extends 'layouts/base-presentation.html' %}

{% block content %}
<header class="header-2">
  <div class="page-header section-height-75 relative"
       style="background-image: url('{{ ASSETS_ROOT }}/img/curved-images/gaming_page.png')">
    <div class="position-absolute w-100 z-index-1 bottom-0">
      <svg class="waves"
           xmlns="http://www.w3.org/2000/svg"
           viewBox="0 24 150 40"
           preserveAspectRatio="none">
        <defs>
          <path id="gentle-wave"
                d="M-160 44c30 0 58-18 88-18s58 18 88 18
                   58-18 88-18 58 18 88 18 v44h-352z" />
        </defs>
        <g class="moving-waves">
          <use href="#gentle-wave" x="48" y="-1" fill="rgba(255,255,255,0.40)" />
          <use href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.35)" />
          <use href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.25)" />
          <use href="#gentle-wave" x="48" y="8" fill="rgba(255,255,255,0.20)" />
          <use href="#gentle-wave" x="48" y="13" fill="rgba(255,255,255,0.15)" />
          <use href="#gentle-wave" x="48" y="16" fill="rgba(255,255,255,0.95)" />
        </g>
      </svg>
    </div>
  </div>
</header>
<section class="pt-3 pb-4 position-relative z-index-2"
         style="margin-top: -450px;">
  <div class="container py-5 bg-white border-radius-xl shadow-lg"
       style="max-width: 500px;">
    <h1 class="mb-4 text-center">Logged out</h1>
    <div class="text-center mb-4">
      <p class="text-sm">
        You have been successfully logged out.
      </p>
    </div>
    <div class="d-grid">
      <a href="{% url 'login' %}" class="btn btn-primary">
        Login again
      </a>
    </div>
  </div>
</section>
{% endblock %}
